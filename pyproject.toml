[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "review-hub"
version = "0.1.0"
description = "Aekovera Review Hub - supplier review and enrichment control plane for CPG sourcing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright",
    "requests",
    "fastapi",
    "uvicorn",
    "jinja2",
    "openpyxl",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff==0.16.8",
    # starlette.testclient requires the httpx2 package on current starlette
    # releases; without it, plain pytest fails at conftest import time.
    "httpx2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
# legacy/ is the frozen v34 reference archive (unmaintained, committed verbatim); skip linting it.
extend-exclude = ["legacy"]

[tool.ruff.lint]
# Explicit rule set for a behavior-parity port: the correctness cores
# (pyflakes F, pycodestyle E4/E7/E9) plus import hygiene (I). The opt-in
# robustness/style suites (BLE001, S110/S112, SIM, UP, C4, DTZ, B, FURB) stay
# off on purpose - the engine deliberately keeps legacy's broad DOM guards
# (a single failed field edit must never kill the batch) and its code shapes.
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.scripts]
review-hub = "review_hub.cli:run"

[tool.setuptools.package-data]
review_hub = [
    "engine/prompts/*.md",
    "server/templates/*.html",
    "server/static/*",
]
